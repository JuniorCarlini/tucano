<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/tucano.css">
<style>
  /* O laranja do tucano e a cor do site, e nao o padrao do pacote (neutro): a
     imagem de compartilhamento mostra a identidade, igual ao site.css. */
  :root{--tuc-accent:#FF7501;--tuc-accent-hover:#FF8A2A;--tuc-accent-fg:#ffffff;--tuc-accent-text:#B84300;--tuc-thumb:#ffffff}
  *{box-sizing:border-box}
  body{
    margin:0;width:1200px;height:630px;overflow:hidden;position:relative;
    background:#fbfbfa;color:#111110;
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Brilho centrado na metade direita, atras do componente. */
  body::before{
    content:'';position:absolute;left:600px;top:50%;translate:0 -50%;
    width:640px;height:640px;
    background:radial-gradient(circle,rgba(255,117,1,.14),transparent 62%);
  }
  /* Duas metades exatas de 600px. */
  .wrap{position:relative;display:flex;height:100%}
  .left,.right{width:600px;position:relative}
  .left{display:flex;flex-direction:column;justify-content:center;padding:0 56px 0 72px}
  .mark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .mark img{display:block;width:56px;height:auto}
  .mark b{font-size:56px;font-weight:660;letter-spacing:-.035em}
  .tag{margin:0;font-size:23px;line-height:1.42;color:#57574f}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
  .pill{
    padding:6px 13px;border:1px solid #e5e5e1;border-radius:999px;background:#fff;
    font-size:14px;color:#6f6f6b;
  }
  .pill b{color:#111110;font-weight:640}
  /* O conjunto campo + calendario centrado na metade direita, nos dois eixos. */
  .anchor{
    position:absolute;left:50%;translate:-50% 0;top:106px;width:296px;height:40px;
    border:1px solid #e5e5e1;border-radius:10px;background:#fff;
    display:flex;align-items:center;padding:0 13px;gap:9px;
    font-size:14px;color:#111110;font-variant-numeric:tabular-nums;
  }
  .anchor svg{color:#a1a19c;flex:none}
  .url{
    position:absolute;left:72px;bottom:44px;font-size:15px;color:#a1a19c;
    font-family:ui-monospace,Menlo,monospace;
  }
</style></head><body>
  <div class="wrap">
    <div class="left">
      <div class="mark"><img src="../site/assets/logo-light.svg" width="56" height="52" alt=""><b>Tucano</b></div>
      <p class="tag">Formulário e interface sem dependências, para Django, Laravel, Rails e HTMX.</p>
      <div class="pills">
        <span class="pill"><b>55 KB</b> gzip</span>
        <span class="pill"><b>0</b> dependências</span>
        <span class="pill">HTML puro</span>
      </div>
    </div>
    <div class="right">
      <div class="anchor" id="field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
        <span>08/09/2026 — 19/09/2026</span>
      </div>
    </div>
  </div>
  <div class="url">github.com/JuniorCarlini/tucano</div>

<script src="../dist/tucano.js"></script>
<script>
  // Usa o componente de verdade: a imagem mostra o que a lib realmente desenha.
  const target = document.createElement('input');
  target.type = 'text';
  document.getElementById('field').appendChild(target);
  target.style.cssText = 'position:absolute;inset:0;opacity:0;pointer-events:none';
  const dp = new Tucano.DatePicker(target, { mode: 'range', months: 1, native: false });
  dp.setValue({ start: '2026-09-08', end: '2026-09-19' }, { silent: true });
  dp.open();
  dp.panel.classList.add('is-open');
  window.__ready = true;
</script>
</body></html>
