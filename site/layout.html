<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="Junior Carlini">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="alternate" type="text/plain" href="{{root}}llms.txt" title="Referência da API para agentes de IA">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Tucano">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://juniorcarlini.github.io/tucano/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://juniorcarlini.github.io/tucano/og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>">

<link rel="stylesheet" href="{{root}}dist/tucano.css?v={{version}}">
<link rel="stylesheet" href="{{root}}site/site.css?v={{version}}">
<!-- O tema e aplicado antes do primeiro quadro: sem isto a pagina piscava clara
     para quem escolheu o escuro. -->
<script>try{if(localStorage.getItem("tucano-tema")==="dark")document.documentElement.classList.add("dark")}catch{}</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="{{home}}"><span class="bird">🦜</span><b>Tucano</b></a>
  <span class="tuc-badge is-plain ver">v{{version}}</span>
  <div class="topbar__actions">
    <button class="tuc-btn is-outline is-icon is-sm" data-tema aria-label="Alternar tema"><svg class="i-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    <button class="tuc-btn is-outline is-icon is-sm" id="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="side"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</header>

<aside class="side" id="side">
  <div class="side__head">
    <a class="brand" href="{{home}}"><span class="bird">🦜</span><b>Tucano</b></a>
    <button class="tuc-btn is-outline is-icon is-sm" data-tema aria-label="Alternar tema"><svg class="i-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </div>
  <span class="tuc-badge is-plain ver">v{{version}} · {{kb-total}} KB</span>
  <nav class="tuc-menu" aria-label="Documentação">
{{nav}}
  </nav>
</aside>

<main class="main">
  <article class="doc">
{{content}}
{{pager}}
  </article>
</main>

<script src="{{root}}dist/tucano.js?v={{version}}"></script>
<script src="{{root}}site/site.js?v={{version}}"></script>
{{scripts}}
</body>
</html>
