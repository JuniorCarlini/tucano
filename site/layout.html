<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="Junior Carlini">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="alternate" type="text/plain" href="{{root}}llms.txt" title="{{ui-llms}}">

<meta property="og:type" content="{{og-type}}">
<meta property="og:site_name" content="Tucano">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://juniorcarlini.github.io/tucano/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og-image-alt}}">
<meta property="og:locale" content="{{og-locale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://juniorcarlini.github.io/tucano/og.png">
<link rel="sitemap" type="application/xml" href="{{root}}sitemap.xml">
{{jsonld}}
<link rel="icon" type="image/svg+xml" href="{{root}}site/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="{{root}}site/assets/favicon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="{{root}}site/assets/favicon-48.png">
<link rel="apple-touch-icon" href="{{root}}site/assets/apple-touch-icon.png">

<link rel="stylesheet" href="{{root}}dist/tucano.css?v={{version}}">
<link rel="stylesheet" href="{{root}}site/site.css?v={{version}}">
<!-- O tema e aplicado antes do primeiro quadro: sem isto a pagina piscava clara
     para quem escolheu o escuro. -->
<script>try{if(localStorage.getItem("tucano-theme")==="dark")document.documentElement.classList.add("dark")}catch{}</script>
</head>
<!-- Rotulos e endereco do indice da busca, lidos pelo site.js: o gerador os
     escreve no idioma da pagina, como os rotulos do botao de tema. -->
<body data-search-index="{{search-index}}" data-search-dialog="{{ui-search-dialog}}" data-search-placeholder="{{ui-search-placeholder}}" data-search-results="{{ui-search-results}}" data-search-loading="{{ui-search-loading}}" data-search-error="{{ui-search-error}}" data-search-empty="{{ui-search-empty}}" data-search-count="{{ui-search-count}}" data-search-hint="{{ui-search-hint}}">

<header class="topbar">
  <a class="brand" href="{{home}}"><img class="brand__logo logo-light" src="{{root}}site/assets/logo-light.svg" width="26" height="24" alt=""><img class="brand__logo logo-dark" src="{{root}}site/assets/logo-dark.svg" width="26" height="24" alt=""><b>Tucano</b></a>
  <span class="tuc-badge is-plain ver">v{{version}}</span>
  <div class="topbar__actions">
    <button class="tuc-btn is-outline is-icon is-sm" data-search aria-label="{{ui-search}}" aria-haspopup="dialog" aria-keyshortcuts="/ Control+K Meta+K"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35"/></svg></button>
    {{lang-switch-top}}
    <button class="tuc-btn is-outline is-icon is-sm" data-theme-toggle data-label-light="{{ui-use-light}}" data-label-dark="{{ui-use-dark}}" aria-label="{{ui-toggle-theme}}"><svg class="i-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    <button class="tuc-btn is-outline is-icon is-sm" id="menu" aria-label="{{ui-open-menu}}" aria-expanded="false" aria-controls="side"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</header>

<aside class="side" id="side">
  <div class="side__head">
    <a class="brand" href="{{home}}"><img class="brand__logo logo-light" src="{{root}}site/assets/logo-light.svg" width="26" height="24" alt=""><img class="brand__logo logo-dark" src="{{root}}site/assets/logo-dark.svg" width="26" height="24" alt=""><b>Tucano</b></a>
    <div class="side__tools">
      {{lang-switch-side}}
      <button class="tuc-btn is-outline is-icon is-sm" data-theme-toggle data-label-light="{{ui-use-light}}" data-label-dark="{{ui-use-dark}}" aria-label="{{ui-toggle-theme}}"><svg class="i-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </div>
  </div>
  <span class="tuc-badge is-plain ver">v{{version}} · {{kb-total}} KB</span>
  <button class="tuc-btn is-outline search-trigger" data-search aria-haspopup="dialog" aria-keyshortcuts="/ Control+K Meta+K"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35"/></svg>{{ui-search}}<kbd class="tuc-badge is-plain">/</kbd></button>
  <nav class="tuc-menu" aria-label="{{ui-docs-nav}}">
{{nav}}
  </nav>
</aside>

<main class="main">
  <article class="doc">
{{content}}
{{pager}}
  </article>
</main>

<script src="{{root}}dist/tucano.js?v={{version}}"></script>
<script src="{{root}}site/site.js?v={{version}}"></script>
{{scripts}}
</body>
</html>
