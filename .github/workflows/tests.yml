# Roda em cada push e cada pull request. Existe porque esta biblioteca ja
# quebrou tres vezes de um jeito que nao aparece no console: nome renomeado num
# lugar so, opcao que ninguem le, exemplo da documentacao que nao funciona.
# Nenhum deles derrubava a pagina — todos derrubavam quem copiasse.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 24, a LTS em uso no desenvolvimento: pedir a major inteira evita que a
      # suite dependa de qual minor o runner instalou naquele dia.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Metade do que interessa so existe num navegador de verdade: <dialog>,
      # top layer, DOMParser, execCommand. E o Safari e o Firefox tem caminhos
      # proprios, entao os testes rodam nos tres motores pelo Playwright. O
      # cache e por versao do Playwright, que e quem fixa a versao de cada
      # navegador; as bibliotecas do sistema vem do apt a cada rodada.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Compila, gera a referencia, carimba a versao, e roda tudo:
      # funcoes puras, comportamento e teclado nos tres navegadores, exemplos da
      # documentacao e as checagens cruzadas de nome.
      - run: npm test

      # Geometria dos campos nos dois temas — some se um token mudar de valor.
      - run: npm run audit

      # O que foi compilado e gerado tem que bater com o que esta versionado:
      # build esquecido antes da tag ja fez o CDN e o npm divergirem. Olha a
      # arvore inteira, e nao uma lista: o site tem uma pasta por componente, e
      # pagina nova esquecida fora do commit tambem e build desatualizado.
      - name: Built files are up to date
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
